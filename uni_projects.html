<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Projects | Josh Hudgell</title>
  <meta name="description" content="University projects by Josh Hudgell." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Projects Section -->
  <section id="projects" class="projects-section">
    <h2>University Projects</h2>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="ai">Machine Learning</button>
      <button class="filter-btn" data-filter="data">Data</button>
      <button class="filter-btn" data-filter="systems">Systems</button>
    </div>

    <div class="projects-grid">
      <!-- Project Tile 1 -->
      <div class="project-card" data-tags="ai" data-project="projects/ml-thesis.html">
        <img src="images/placeholder-ai.svg" alt="" />
        <h3>Machine Learning Thesis</h3>
        <p class="tags">AI / ML</p>
        <a href="projects/ml-thesis.html" class="details-link">Project details</a>
      </div>

      <!-- Project Tile 2 -->
      <div class="project-card" data-tags="data" data-project="projects/network-mining.html">
        <img src="images/placeholder-data.svg" alt="" />
        <h3>Network Mining</h3>
        <p class="tags">Data Mining</p>
        <a href="projects/network-mining.html" class="details-link">Project details</a>
      </div>

      <!-- Project Tile 3 -->
      <div class="project-card" data-tags="systems" data-project="projects/compiler-design.html">
        <img src="images/placeholder-systems.svg" alt="" />
        <h3>Compiler Design</h3>
        <p class="tags">Systems</p>
        <a href="projects/compiler-design.html" class="details-link">Project details</a>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="app.js"></script>
</body>
</html>
