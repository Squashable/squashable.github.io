<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Projects | Josh Hudgell</title>
  <meta name="description" content="Personal projects by Josh Hudgell." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Projects Section -->
  <section id="projects" class="projects-section">
    <h2>Home Projects</h2>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="web">Web</button>
      <button class="filter-btn" data-filter="data">Data</button>
      <button class="filter-btn" data-filter="hardware">Hardware</button>
    </div>

    <div class="projects-grid">
      <!-- Project Tile 1 -->
      <div class="project-card" data-tags="web" data-project="projects/personal-blog.html">
        <img src="images/placeholder-web.svg" alt="" />
        <h3>Personal Blog</h3>
        <p class="tags">Web</p>
        <a href="projects/personal-blog.html" class="details-link">Project details</a>
      </div>

      <!-- Project Tile 2 -->
      <div class="project-card" data-tags="data" data-project="projects/fitness-tracker.html">
        <img src="images/placeholder-data.svg" alt="" />
        <h3>Fitness Tracker</h3>
        <p class="tags">Data</p>
        <a href="projects/fitness-tracker.html" class="details-link">Project details</a>
      </div>

      <!-- Project Tile 3 -->
      <div class="project-card" data-tags="hardware web" data-project="projects/smart-home.html">
        <img src="images/placeholder-hardware.svg" alt="" />
        <h3>Smart Home</h3>
        <p class="tags">Hardware</p>
        <a href="projects/smart-home.html" class="details-link">Project details</a>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="app.js"></script>
</body>
</html>
