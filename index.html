<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Josh Hudgell – Portfolio</title>
  <meta name="description" content="Personal website showcasing academic and personal projects." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Hero Section -->
  <section id="hero" class="hero-section">
    <h1>Josh Hudgell</h1>
    <p>Portfolio for my personal and university projects</p>
    <a href="#projects" class="cta-button">View Featured Projects</a>
  </section>

  <!-- Featured Projects Section -->
  <section id="projects" class="projects-section">
    <h2>Featured Projects</h2>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="web">Personal projects</button>
      <button class="filter-btn" data-filter="data">University projects</button>
      <button class="filter-btn" data-filter="hardware">Colabrative projects</button>
    </div>
    <div class="projects-grid">
      <!-- Card 1 -->
      <div class="project-card" data-tags="web" data-project="projects/personal-blog.html">
        <img src="images/placeholder-web.svg" alt="Example Project - Web thumbnail" />
        <h3>Example Project - Web</h3>
        <p class="tags">Web</p>
        <a href="projects/personal-blog.html" class="details-link">Read Story</a>
      </div>
      <!-- Card 2 -->
      <div class="project-card" data-tags="data" data-project="projects/fitness-tracker.html">
        <img src="images/placeholder-data.svg" alt="Example Project - Data thumbnail" />
        <h3>Example Project - Data</h3>
        <p class="tags">Data</p>
        <a href="projects/fitness-tracker.html" class="details-link">Read Story</a>
      </div>
      <!-- Card 3 -->
      <div class="project-card" data-tags="ai" data-project="projects/ml-thesis.html">
        <img src="images/placeholder-ai.svg" alt="Example Project - AI / ML thumbnail" />
        <h3>Example Project - AI / ML</h3>
        <p class="tags">AI / ML</p>
        <a href="projects/ml-thesis.html" class="details-link">Read Story</a>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="app.js"></script>
</body>
</html>
